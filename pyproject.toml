[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honestcode"
version = "0.2.0"
description = "A lightweight MCP server that detects AI code hallucinations in real time — undefined symbols, wrong API calls, dead code, and type mismatches."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "HonestCode Team" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "hallucination-detection",
    "code-generation",
    "static-analysis",
    "llm",
    "ai",
    "code-analysis",
    "dead-code",
    "type-checking",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    # mcp 2.x removed `mcp.server.fastmcp`; pin <2.0 until we adapt to the new API.
    "mcp>=1.6.0,<3.0",
    "pyyaml>=6.0",
    "tomli>=2.0.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.5.0",
    "pre-commit>=3.0",
]
multi-language = [
    "tree-sitter>=0.21,<0.26",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-go>=0.21",
    "tree-sitter-rust>=0.21",
    "tree-sitter-java>=0.21",
]

[project.scripts]
honestcode-mcp = "honestcode.mcp.server:main"
honestcode = "honestcode.cli:main"

[project.urls]
Homepage = "https://github.com/Fengrru/honestcode"
Documentation = "https://github.com/Fengrru/honestcode#readme"
Repository = "https://github.com/Fengrru/honestcode"
Issues = "https://github.com/Fengrru/honestcode/issues"
Changelog = "https://github.com/Fengrru/honestcode/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["honestcode*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
]

[tool.ruff.lint.isort]
known-first-party = ["honestcode"]

[tool.coverage.run]
source = ["honestcode"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
